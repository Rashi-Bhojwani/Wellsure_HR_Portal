<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA (Phase 5 commit G): installable, with our own icons. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wellsure" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Wellsure HR Portal</title>
    <!-- The Wellsure logo and favicon are supplied by the repo owner at public/logo.png and public/favicon.png (never drawn here). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Before the first paint: the saved theme (or the device's), so a dark-mode user never sees a white flash. The colours are tokens.ts bgPage/textBody
         (src/theme/__tests__/theme.test.ts keeps them equal). -->
    <script>
      (function () {
        var p = "system";
        try {
          p = localStorage.getItem("wellsure-theme-mode") || "system";
        } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.background = dark ? "#0E0E0C" : "#FFFDF0";
        root.style.color = dark ? "#E6E4D4" : "#1C1C18";
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
