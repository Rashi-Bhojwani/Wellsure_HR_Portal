name: CI

# Every push to every branch (main and any working branch), every pull
# request, and on demand. Until 2026-10-01 this ran only on pull requests and
# pushes to main; all work so far happened on claude/* branches with no PRs,
# so CI had never actually run once.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-typecheck-test:
    runs-on: ubuntu-latest
    # Postgres/Redis as service containers — nothing needed on the runner
    # beyond Docker (which GitHub-hosted runners already have). Same
    # DATABASE_URL/REDIS_URL shape as local dev (see README.md), just
    # pointed at these containers instead of a locally installed service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellsure
          POSTGRES_PASSWORD: wellsure
          POSTGRES_DB: wellsure_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellsure -d wellsure_hr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wellsure:wellsure@localhost:5432/wellsure_hr
      REDIS_URL: redis://localhost:6379
      # Letters render real PDFs in the test suite (Phase 5 commit D2). The
      # GitHub-hosted Ubuntu image ships Google Chrome here.
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            biometric-agent/package-lock.json
            infra/package-lock.json

      # backend's postinstall runs `prisma generate`. Without it the typecheck
      # ran against @prisma/client's empty default stub: its own postinstall
      # silently does nothing if it runs before the prisma CLI is linked.
      - name: Install
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check services
        run: npm run check:services

      - name: Migrate
        run: npm run db:migrate

      # The migrations and schema.prisma must describe the same database: a relation
      # whose onDelete differs here would be "fixed" by the next `migrate dev` into a
      # migration nobody wrote (P2-J found one). Exits non-zero on any difference.
      - name: Schema matches migrations
        run: npm run db:drift

      # Migrate + seed the dev database exactly as a new developer would, to
      # prove that path works from scratch. The test suite itself then builds
      # its own database (wellsure_hr_test) in vitest.globalSetup.ts.
      - name: Seed
        run: npm run db:seed

      - name: Test
        run: npm run test

      # The demo company (made-up people, salaries and a fictional bank file) is built on the test database and the sensitive-data crawl is repeated on it as the developer.
      - name: Demo company tests
        run: npm run test:demo --prefix backend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t wellsure-hr-backend .

  # The Windows service (Phase 2 P2-F, commit F2; docs/plans/PHASE_2.md "P2-F,
  # commit F2 build design"). Builds the single executable and the release zip,
  # then installs that zip for real and exercises the service: its account, the
  # secrets, a punch reaching a fake API, restart on kill, an API outage,
  # the event log, a rotated key, upgrade and uninstall. A runner can't
  # reboot: restart on failure plus automatic start stand in for that.
  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NSSM_VERSION: "2.24"
      # nssm.cc is the only official source and is sometimes unreliable: the
      # zip is checked against this hash before use, and cached by it.
      NSSM_SHA256: "727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biometric-agent/package-lock.json

      - name: Install
        working-directory: biometric-agent
        run: npm ci

      # The same unit tests as the Linux job, here, to catch path and lock
      # differences between the two platforms.
      - name: Unit tests on Windows
        working-directory: biometric-agent
        run: npm test

      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem biometric-agent -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            $errors = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "ok  $($_.Name)" }
          }
          if ($bad) { exit 1 }

      - uses: actions/cache@v4
        with:
          path: nssm-dl
          key: nssm-${{ env.NSSM_VERSION }}-${{ env.NSSM_SHA256 }}

      - name: Fetch NSSM (checked against the pinned hash)
        shell: powershell
        run: ./biometric-agent/packaging/fetch-nssm.ps1 -Version $env:NSSM_VERSION -Sha256 $env:NSSM_SHA256 -OutDir nssm-dl

      - name: Build the executable
        working-directory: biometric-agent
        run: npm run build:exe

      - name: Assemble and zip the release
        shell: powershell
        run: |
          Push-Location biometric-agent
          node packaging/package-release.mjs --nssm "..\nssm-dl\nssm-$env:NSSM_VERSION\win64\nssm.exe" --out ..\release
          Pop-Location
          $version = (Get-Content biometric-agent\package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-zip | Out-Null
          Compress-Archive -Path "release\wellsure-agent-$version" -DestinationPath "dist-zip\wellsure-agent-$version-windows-x64.zip" -Force
          Get-ChildItem dist-zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: wellsure-agent-windows
          path: dist-zip/*.zip
          # The longest GitHub keeps one. Connection day may be weeks away and
          # must not depend on nssm.cc being reachable to rebuild (plan, "NSSM").
          retention-days: 90

      - name: Install the release and exercise the service
        shell: powershell
        run: |
          $zip = (Get-ChildItem dist-zip -Filter *.zip | Select-Object -First 1).FullName
          ./biometric-agent/ci/windows-service-test.ps1 -ZipPath $zip -RepoDir $PWD.Path

      - name: Diagnostics (agent log, service state)
        if: failure()
        shell: powershell
        run: |
          Get-Service WellsureAgent -ErrorAction SilentlyContinue | Format-List *
          $log = Join-Path $env:ProgramData 'Wellsure Agent\logs\agent.log'
          if (Test-Path $log) { Write-Host '--- agent.log (last 80 lines)'; Get-Content $log -Tail 80 }
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'agent-ci') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          try { Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'WellsureAgent' } -MaxEvents 20 -ErrorAction Stop | Format-List TimeCreated, Id, LevelDisplayName, Message } catch { Write-Host 'no WellsureAgent events' }

  # The month replay for 500 employees (Phase 2 P2-G; docs/plans/PHASE_2.md "P2-G
  # build design"): a whole month, every named scenario, through the real
  # ingestion service and the real recompute path, failing if ANY employee-day is
  # stored differently from what its scenario says it should be. Its own job so
  # it doesn't slow every run; the 40-employee version of the same replay is in
  # the normal backend suite. Its timings are checked against
  # backend/perf/baseline.json (fail if more than 2x), which this runner records.
  attendance-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellsure
          POSTGRES_PASSWORD: wellsure
          POSTGRES_DB: wellsure_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellsure -d wellsure_hr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wellsure:wellsure@localhost:5432/wellsure_hr
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            biometric-agent/package-lock.json

      # The route replays run the real `simulate` CLI and the real agent, which live in biometric-agent/.
      - name: Install
        run: |
          npm install --prefix backend
          npm install --prefix biometric-agent

      - name: Replay a month for 500 employees, then 40 through each real route
        run: npm run test:replay --prefix backend

      - name: The figures (these are what the baseline is recorded from)
        if: always()
        run: |
          cat backend/perf/last-run.json || true
          echo "### Month replay, 500 employees" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat backend/perf/last-run.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: month-replay-figures
          path: backend/perf/last-run.json
          if-no-files-found: ignore


  # Gate G1 of Phase 2 (docs/plans/PHASE_2.md §12, "P2-G, commit G2 build design"):
  # a punch must show on the employee's own screen and on HR's Who Is In? within
  # 5 seconds, by every route, in a real browser. This job boots the whole
  # stack (API, worker, frontend) on a freshly seeded database and measures it.
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellsure
          POSTGRES_PASSWORD: wellsure
          POSTGRES_DB: wellsure_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellsure -d wellsure_hr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wellsure:wellsure@localhost:5432/wellsure_hr
      REDIS_URL: redis://localhost:6379
      # The seeded development accounts' documented password (a throwaway database).
      SIM_USER: "1000"
      SIM_PASSWORD: Wellsure@123
      # The GitHub-hosted Ubuntu image ships Google Chrome here.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            biometric-agent/package-lock.json

      - name: Install
        run: |
          npm install
          npm install --prefix backend
          npm install --prefix frontend
          npm install --prefix biometric-agent

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start the API, the worker and the frontend
        run: |
          mkdir -p "$RUNNER_TEMP/stack"
          nohup npm run start --prefix backend > "$RUNNER_TEMP/stack/api.log" 2>&1 &
          nohup npm run start --prefix backend -- worker > "$RUNNER_TEMP/stack/worker.log" 2>&1 &
          nohup npm run dev --prefix frontend > "$RUNNER_TEMP/stack/frontend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:4000/ready > /dev/null && curl -fs http://localhost:5173/login > /dev/null; then echo "stack is up after ${i} checks"; exit 0; fi
            sleep 2
          done
          echo "the stack did not come up"; tail -n 40 "$RUNNER_TEMP"/stack/*.log; exit 1

      # Before the latency measurement, which logs in a lot: this logs in twice. Every popover, dropdown and drawer in both portals, at 390px and at desktop width.
      - name: Popovers and dropdowns at phone and desktop width
        run: npm run check:popovers --prefix frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popover-screenshots
          path: frontend/e2e/out/*.png
          if-no-files-found: ignore

      - name: Measure punch-to-screen latency, by every route
        run: npm run test:latency --prefix biometric-agent

      - name: The figures
        if: always()
        run: |
          cat biometric-agent/perf/latency-last-run.json || true
          echo "### Punch-to-screen latency" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat biometric-agent/perf/latency-last-run.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-figures-and-logs
          path: |
            biometric-agent/perf/latency-last-run.json
            ${{ runner.temp }}/stack/*.log
          if-no-files-found: ignore

      # Last, because it fills the database with the demo company: the developer and an employee open every page of both portals; no made-up secret may be on any, and
      # the DEMO COMPANY banner must be on all of them (docs/plans/PHASE_6.md §14J).
      - name: Seed the demo company, then look for secrets on every page
        run: |
          npm run seed:demo-company --prefix backend
          npm run check:sensitive-ui --prefix frontend
